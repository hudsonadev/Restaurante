<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} · Comanda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='common.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#inicio">Ir para o conteúdo</a>
    <header class="masthead">
        <div class="masthead-inner">
            <a class="wordmark" href="/">Comanda</a>
            <nav class="admin-nav" aria-label="Navegação administrativa">
                {% for rota, nome in [('/', 'Visão geral'), ('/novo-pedido', 'Novo pedido'), ('/categorias', 'Categorias'), ('/cardapio', 'Cardápio'), ('/analises', 'Análises')] %}
                <a href="{{ rota }}" {% if request.path == rota %}aria-current="page"{% endif %}>{{ nome }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>
    <main id="inicio">{% block content %}{% endblock %}</main>
</body>
</html>
