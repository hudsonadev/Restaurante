{% extends "base.html" %}{% block title %}Catálogo{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='tabelas.js') }}" defer></script>{% endblock %}
{% block content %}
<header class="page-header"><h1>Catálogo</h1></header>
<section class="panel" data-filter-table>
    <div class="filters"><label class="search-field" for="buscar-titulo">Buscar título<input id="buscar-titulo" data-search type="search"></label><label for="genero-global">Gênero<select id="genero-global" data-genre><option value="">Todos os gêneros</option>{% for genero in itens|map(attribute='genero')|unique|sort %}<option value="{{ genero }}">{{ genero }}</option>{% endfor %}</select></label></div>
    <div class="table-scroll" tabindex="0" role="region" aria-label="Catálogo global"><table><caption>Consumo atual por título</caption><thead><tr><th scope="col">Título</th><th scope="col" class="text">Gênero</th><th scope="col">Usuários que assistiram</th></tr></thead><tbody>
    {% for c in itens %}<tr data-row data-search-value="{{ c.titulo }}" data-genre-value="{{ c.genero }}"><th scope="row">{{ c.titulo }}</th><td class="text">{{ c.genero }}</td><td>{{ c.quantidade_usuarios }}</td></tr>{% endfor %}
    </tbody></table></div><p data-filter-status class="muted" role="status"></p>
</section>{% endblock %}
